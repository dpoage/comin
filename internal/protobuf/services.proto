// To generate Go code, from the repository root directory, run:
// protoc --go_out=. --go_opt=paths=source_relative --go-grpc_out=. --go-grpc_opt=paths=source_relative internal/protobuf/services.proto 

edition = "2023";

package protobuf;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";

option features.field_presence = IMPLICIT;
option go_package = "github.com/nlewo/comin/internal/protobuf";

service Comin {
  rpc GetState(google.protobuf.Empty) returns (State) {}
  rpc Fetch(google.protobuf.Empty) returns (google.protobuf.Empty) {}
  rpc Suspend(google.protobuf.Empty) returns (google.protobuf.Empty) {}
  rpc Resume(google.protobuf.Empty) returns (google.protobuf.Empty) {}
  rpc Confirm(ConfirmRequest) returns (google.protobuf.Empty) {}
  rpc Events(google.protobuf.Empty) returns (stream Event);
  rpc SwitchDeploymentLatest(google.protobuf.Empty) returns (google.protobuf.Empty) {}
}

message Event {
  message EvalStarted {
    Generation generation = 1;
  }
  message EvalFinished {
    Generation generation = 1;
  }
  message BuildStarted {
    Generation generation = 1;
  }
  message BuildFinished {
    Generation generation = 1;
  }
  message ConfirmationSubmitted {
    string mode = 1;
    string uuid = 2;
  }
  message ConfirmationCancelled {
    string uuid = 1;
  }
  message ConfirmationConfirmed {
    string origin = 1; 
    string uuid = 2;
  }
  message Resume {
  }
  message Suspend {
  }
  message DeploymentStarted {
    Deployment deployment = 1;
  }
  message DeploymentFinished {
    Deployment deployment = 1;
  }
  message RebootRequired {
    Deployment deployment = 1;
  }
  oneof Type {
    EvalStarted evalStartedType = 1;
    EvalFinished evalFinishedType = 2;
    BuildStarted buildStartedType = 3;
    BuildFinished buildFinishedType = 4;
    ConfirmationSubmitted confirmationSubmittedType = 5;
    ConfirmationCancelled confirmationCancelledType = 6;
    ConfirmationConfirmed confirmationConfirmedType = 7;
    Resume resume = 8;
    Suspend suspend = 9;
    DeploymentStarted deploymentStartedType = 10;
    DeploymentFinished deploymentFinishedType = 11;
    RebootRequired rebootRequired = 12;
  }
}

message ConfirmRequest {
  string generationUuid = 1;
  string for = 2;  // possible values: "build", "deploy", "all"
}

// We consider each created genration is legit to be deployed: hard
// reset is ensured at RepositoryStatus creation.
message Generation {
  string uuid = 1;

  string repository_path = 24;
  string repository_subdir = 25;
  string system_attr = 26;
  string hostname = 3;

  string selected_remote_url = 4;
  string selected_remote_name = 5;
  string selected_branch_name = 6;
  string selected_commit_id = 7;
  string selected_commit_msg = 8;
  google.protobuf.BoolValue selected_branch_is_testing = 9;

  string main_commit_id = 10;
  string main_remote_name = 11;
  string main_branch_name = 12;

  string eval_status = 13;
  google.protobuf.Timestamp eval_started_at = 14;
  google.protobuf.Timestamp eval_ended_at = 15;
  string eval_err = 16;

  string out_path = 17;
  string drv_path = 18;
  string machine_id = 19;

  string build_status = 20;
  string build_reason = 27;
  google.protobuf.Timestamp build_started_at = 21;
  google.protobuf.Timestamp build_ended_at = 22;
  string build_err = 23;
}

message Deployment {
  string uuid = 1;
  string reason = 10;
  Generation generation = 2;

  google.protobuf.Timestamp started_at = 3;
  google.protobuf.Timestamp ended_at = 4;

  string error_msg = 5;
  google.protobuf.BoolValue restart_comin = 6;
  string profile_path = 7;
  string status = 8;
  string operation = 9;
}

message State {
  google.protobuf.BoolValue need_to_reboot = 1;
  google.protobuf.BoolValue is_suspended = 2;
  Builder builder = 3;
  Deployer deployer = 4;
  Fetcher fetcher = 5;
  Store store = 6;
  Confirmer build_confirmer = 7;
  Confirmer deploy_confirmer = 8;
  reserved 9;
  reserved drift;
  Reconcile reconcile = 10;
}

// ReconcileTarget is the candidate a reconcile status names.
message ReconcileTarget {
  string commit = 1;
  // branch is the real branch name, not main or testing
  string branch = 2;
  string out_path = 3;
}

// ReconcileCandidate is one entry of the walk a reconcile status reports.
message ReconcileCandidate {
  // branch is the real branch name, not main or testing
  string branch = 1;
  // kind is main or testing, the COMIN_BRANCH value of its asks
  string kind = 2;
  string commit = 3;
  // out_path is empty when the candidate was not evaluated
  string out_path = 4;
  // outcome is one of admitted, refused, failed, pending or skipped
  string outcome = 5;
  // reason is the preflight line of a refusal, comin's line of a failure,
  // comin's progress line of a pending candidate (evaluating, building or
  // awaiting build confirmation <sha>; deployment in flight <sha> when it
  // is not asked because a deployment of <sha> is in flight); empty for
  // admitted and skipped
  string reason = 6;
}

// Reconcile is the convergence of the running system to the repository.
message Reconcile {
  // state is one of converged, waiting, deploying or failed
  string state = 1;
  // desired is null when the state names no candidate
  ReconcileTarget desired = 2;
  // current is empty when it cannot be read
  string current = 3;
  // reason is the comin or preflight line; empty when there is nothing to explain
  string reason = 4;
  // since is when this process first observed the state value
  google.protobuf.Timestamp since = 5;
  // candidates is the current pass's walk, in preference order; empty
  // while suspended or when there is no candidate
  repeated ReconcileCandidate candidates = 6;
  // observed_at is when the pass that produced this status started, on
  // the host clock; that pass read every input after it. With T a host
  // time taken after a change took effect, observed_at > T shows a pass
  // that read every input after T. Null before the first pass.
  google.protobuf.Timestamp observed_at = 7;
}

message Deployer {
  google.protobuf.BoolValue is_deploying = 1;
  Deployment deployment = 2;
  Generation generation_to_deploy = 3;
  string operation = 6;
  Deployment previous_deployment = 4;
  google.protobuf.BoolValue is_suspended = 5;
}

message Builder {
  google.protobuf.BoolValue is_evaluating = 1;
  google.protobuf.BoolValue is_building = 2;
  Generation generation = 3;
  string generation_uuid = 4;
  google.protobuf.BoolValue is_suspended = 5;
  string hostname = 6;
}

message Confirmer {
  int64 mode = 1;
  string submitted = 2;
  string confirmed = 3;
  int64 autoconfirm_duration = 4;
  google.protobuf.Timestamp autoconfirm_started_at = 5;
  google.protobuf.BoolValue autoconfirm_started = 6;
}

message Fetcher {
  google.protobuf.BoolValue is_fetching = 1;
  RepositoryStatus repository_status = 2;
}

message Branch {
  string name = 1;
  string commit_id = 2;
  string commit_msg = 3;
  string error_msg = 4;
  string on_top_of = 5;
  // True when one of the configured GPG public keys signed commit_id
  google.protobuf.BoolValue signed = 6;
  // The primary identity name of the signer of commit_id, when signed
  string signed_by = 7;
}

message Remote {
  string name = 1;
  string url = 2;
  string fetch_error_msg = 3;
  Branch main = 4;
  Branch testing = 5;
  google.protobuf.Timestamp fetched_at = 6;
  google.protobuf.BoolValue fetched = 7;
}

message RepositoryStatus {
  // This is the deployed Main commit ID. It is used to ensure fast forward
  string selected_commit_id = 1;
  string selected_commit_msg = 2;
  string selected_remote_name = 3;
  string selected_branch_name = 4;
  google.protobuf.BoolValue selected_branch_is_testing = 5;
  google.protobuf.BoolValue selected_commit_signed = 6;
  string selected_commit_signed_by = 7;
  // True if GPG public keys are configured: the selected commit must be signed
  google.protobuf.BoolValue selected_commit_should_be_signed = 8;
  string main_commit_id = 9;
  string main_remote_name = 10;
  string main_branch_name = 11;
  repeated Remote remotes = 12;
  string error_msg = 13;
}

message Store {
  repeated Deployment deployments = 1;
  repeated Generation generations = 2; 
}